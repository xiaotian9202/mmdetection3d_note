<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg2d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="glow2d" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80"/>
    </marker>
    <marker id="arr-rot" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #f8fafc; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
    .math { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; font-size: 15px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
    .card-code { font-family: "Consolas", "Fira Code", monospace; font-size: 13px; fill: #cbd5e1; }
  </style>

  <!-- 背景 -->
  <rect width="820" height="480" rx="16" fill="url(#bg2d)" stroke="#1e293b" stroke-width="2"/>

  <!-- 标题 -->
  <text x="35" y="38" class="title">2D 平面旋转几何原理与极坐标推导 (2D Rotation Derivation)</text>
  <text x="35" y="60" class="label" fill="#94a3b8" font-size="12">点 P 绕原点逆时针旋转 θ 到达 P'，基于三角函数和角公式推导旋转矩阵</text>

  <!-- ==================== 坐标系轴线 ==================== -->
  <!-- 原点 O 设在 (160, 360) -->
  <!-- X 轴 -->
  <line x1="100" y1="360" x2="480" y2="360" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-axis)"/>
  <text x="485" y="365" class="label" fill="#cbd5e1">x 轴</text>

  <!-- Y 轴 -->
  <line x1="160" y1="410" x2="160" y2="80" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-axis)"/>
  <text x="165" y="85" class="label" fill="#cbd5e1">y 轴</text>

  <!-- 原点 O 标注 -->
  <circle cx="160" cy="360" r="4" fill="#94a3b8"/>
  <text x="140" y="380" class="math" fill="#94a3b8">O(0,0)</text>

  <!-- 半径 r 的旋转轨迹圆弧 (虚线) -->
  <!-- r = 240, 从角度 0 到 70 度 -->
  <!-- 角度 25度: P点; 角度 65度: P'点 -->
  <!-- 25度: cos=0.906, sin=0.423 => x = 160 + 240*0.906 = 377, y = 360 - 240*0.423 = 258 -->
  <!-- 65度: cos=0.423, sin=0.906 => x = 160 + 240*0.423 = 261, y = 360 - 240*0.906 = 143 -->
  <path d="M 400 360 A 240 240 0 0 0 242 122" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ==================== 1. 旋转前：点 P (x, y) ==================== -->
  <!-- OP 向量 (蓝色) -->
  <line x1="160" y1="360" x2="377" y2="258" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle cx="377" cy="258" r="6" fill="#38bdf8" filter="url(#glow2d)"/>
  <text x="390" y="255" class="math" fill="#38bdf8" font-size="16" font-weight="bold">P(x, y)</text>
  <text x="390" y="275" class="label" fill="#7dd3fc" font-size="12">旋转前位置</text>

  <!-- P 的坐标投影虚线 -->
  <line x1="377" y1="258" x2="377" y2="360" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="377" y1="258" x2="160" y2="258" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="377" cy="360" r="3" fill="#38bdf8"/>
  <circle cx="160" cy="258" r="3" fill="#38bdf8"/>
  <text x="372" y="378" class="math" fill="#38bdf8" font-size="13">x</text>
  <text x="145" y="263" class="math" fill="#38bdf8" font-size="13">y</text>

  <!-- 角度 φ 弧线 (从 X轴 到 OP) -->
  <path d="M 230 360 A 70 70 0 0 0 223 330" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="238" y="345" class="math" fill="#38bdf8">φ</text>

  <!-- 半径 r 标注 -->
  <text x="280" y="300" class="math" fill="#94a3b8">r</text>

  <!-- ==================== 2. 旋转后：点 P' (x', y') ==================== -->
  <!-- OP' 向量 (绿色) -->
  <line x1="160" y1="360" x2="261" y2="143" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <circle cx="261" cy="143" r="6" fill="#4ade80" filter="url(#glow2d)"/>
  <text x="272" y="135" class="math" fill="#4ade80" font-size="16" font-weight="bold">P'(x', y')</text>
  <text x="272" y="155" class="label" fill="#86efac" font-size="12">旋转后位置</text>

  <!-- P' 的坐标投影虚线 -->
  <line x1="261" y1="143" x2="261" y2="360" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="261" y1="143" x2="160" y2="143" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="261" cy="360" r="3" fill="#4ade80"/>
  <circle cx="160" cy="143" r="3" fill="#4ade80"/>
  <text x="255" y="378" class="math" fill="#4ade80" font-size="13">x'</text>
  <text x="140" y="148" class="math" fill="#4ade80" font-size="13">y'</text>

  <!-- 旋转角度 θ 弧线 (从 OP 到 OP') -->
  <path d="M 268 300 A 120 120 0 0 0 211 251" fill="none" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arr-rot)"/>
  <text x="255" y="270" class="math" fill="#f43f5e" font-size="16" font-weight="bold">θ</text>

  <!-- ==================== 3. 右侧数学推导卡片 ==================== -->
  <g transform="translate(500, 75)">
    <!-- 卡片底板 -->
    <rect width="295" height="360" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    
    <rect x="0" y="0" width="295" height="38" rx="12" fill="#0f172a"/>
    <text x="15" y="24" class="card-title">💡 极坐标推导 4 步法</text>

    <!-- 步骤 1 -->
    <text x="15" y="65" class="label" fill="#38bdf8">1. 旋转前极坐标 (初始角 φ):</text>
    <text x="25" y="85" class="math" fill="#cbd5e1">x = r · cos φ</text>
    <text x="25" y="105" class="math" fill="#cbd5e1">y = r · sin φ</text>

    <!-- 步骤 2 -->
    <text x="15" y="135" class="label" fill="#4ade80">2. 旋转后极坐标 (总角 φ + θ):</text>
    <text x="25" y="155" class="math" fill="#cbd5e1">x' = r · cos(φ + θ)</text>
    <text x="25" y="175" class="math" fill="#cbd5e1">y' = r · sin(φ + θ)</text>

    <!-- 步骤 3 -->
    <text x="15" y="205" class="label" fill="#f59e0b">3. 高中和角公式展开:</text>
    <text x="25" y="225" class="math" fill="#fde68a" font-size="13">x' = r cos φ cos θ - r sin φ sin θ</text>
    <text x="25" y="245" class="math" fill="#fde68a" font-size="13">y' = r sin φ cos θ + r cos φ sin θ</text>
    <text x="25" y="270" class="label" fill="#94a3b8" font-size="12">代入步骤 1 的 x 和 y 即得核心公式:</text>
    <text x="25" y="292" class="math" fill="#38bdf8" font-weight="bold">x' = x cos θ - y sin θ</text>
    <text x="25" y="312" class="math" fill="#4ade80" font-weight="bold">y' = x sin θ + y cos θ</text>

    <!-- 步骤 4 矩阵形式 -->
    <line x1="15" y1="325" x2="280" y2="325" stroke="#334155" stroke-width="1"/>
    <text x="15" y="345" class="label" fill="#e2e8f0">4. 矩阵形式:</text>
    <text x="95" y="345" class="card-code" fill="#f43f5e">P' = R(θ) · P</text>
  </g>

</svg>
