<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgAlpha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="glowAlpha" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arr-axis-alpha" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-los" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-heading" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arr-arc" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #f8fafc; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
    .math { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; font-size: 15px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; }
  </style>

  <rect width="860" height="520" rx="16" fill="url(#bgAlpha)" stroke="#1e293b" stroke-width="2"/>

  <!-- 标题 -->
  <text x="35" y="38" class="title">KITTI 航向角 (Yaw / rotation_y) 与观测角 (Observation Angle / alpha) 几何关系</text>
  <text x="35" y="60" class="label" fill="#94a3b8" font-size="12">鸟瞰图 (BEV) 俯视 X-Z 平面：单目 3D 检测中视觉外观与空间真实朝向的解耦原理</text>

  <!-- ==================== 几何作图区 (BEV: 俯视相机坐标系) ==================== -->
  <!-- 原点设在底部中心偏左: O = (220, 420) -->

  <!-- 相机正前向 Z 轴 (垂直向上) -->
  <line x1="220" y1="420" x2="220" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#arr-axis-alpha)"/>
  <text x="225" y="95" class="label" fill="#cbd5e1">相机光轴 +Z (前向深度)</text>

  <!-- 相机横向 X 轴 (向右) -->
  <line x1="160" y1="420" x2="480" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#arr-axis-alpha)"/>
  <text x="485" y="425" class="label" fill="#cbd5e1">+X 轴 (向右)</text>

  <!-- 相机光心点 O(0,0) -->
  <circle cx="220" cy="420" r="7" fill="#f8fafc" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="200" y="445" class="label" fill="#f8fafc">相机光心 O(0,0)</text>

  <!-- 目标物体位置 P(X, Z): 设在 (370, 180) -->
  <!-- 视线连线 Line-of-Sight (从 O 到 P) -->
  <line x1="220" y1="420" x2="370" y2="180" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-los)"/>

  <!-- 视线角 β 弧线 (从 Z 轴 到 视线 OP) -->
  <!-- 角度: dx=150, dz=-240 => atan2(150, 240) = 32度 -->
  <path d="M 220 320 A 100 100 0 0 1 273 335" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr-arc)"/>
  <text x="250" y="320" class="math" fill="#38bdf8" font-size="16" font-weight="bold">β</text>
  <text x="265" y="340" class="label" fill="#7dd3fc" font-size="11">视线方位角</text>
  <text x="265" y="355" class="math" fill="#7dd3fc" font-size="11">arctan2(X, Z)</text>

  <!-- 目标车辆 Bounding Box (以点 P 为中心，旋转一定角度) -->
  <g transform="translate(370, 180) rotate(15)">
    <!-- 车辆矩形框 -->
    <rect x="-35" y="-60" width="70" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="0" y="5" font-family="sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="bold">目标车辆</text>
    <!-- 前脸指示 -->
    <polygon points="-20,-55 20,-55 0,-70" fill="#f59e0b"/>
  </g>

  <!-- 物体真实中心点 P(X, Z) -->
  <circle cx="370" cy="180" r="6" fill="#fbbf24" stroke="#d97706" stroke-width="2" filter="url(#glowAlpha)"/>
  <text x="385" y="165" class="math" fill="#fbbf24" font-size="15" font-weight="bold">P(X, Z)</text>

  <!-- 车辆局部参考线 (从 P 引出平行于 +X 轴的水平参考虚线) -->
  <line x1="370" y1="180" x2="490" y2="180" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="495" y="185" class="label" fill="#94a3b8" font-size="11">平行于 X 轴</text>

  <!-- 车辆自身朝向航向箭头 (Heading Vector, 红色) -->
  <!-- 设朝向角 rotation_y 相对 X 轴为 75度 (dx = cos75=0.258, dy = -sin75=-0.965) -->
  <!-- 终点: (370 + 100*0.258, 180 - 100*0.965) = (396, 83) -->
  <line x1="370" y1="180" x2="400" y2="65" stroke="#f43f5e" stroke-width="3" marker-end="url(#arr-heading)" filter="url(#glowAlpha)"/>
  <text x="408" y="70" class="label" fill="#f43f5e" font-size="14" font-weight="bold">车头朝向 (Heading)</text>

  <!-- 全局航向角 rotation_y 弧线 (从 +X 方向 到 车头朝向) -->
  <path d="M 430 180 A 60 60 0 0 0 378 122" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arr-arc)"/>
  <text x="435" y="145" class="math" fill="#f43f5e" font-size="15" font-weight="bold">rotation_y</text>
  <text x="440" y="160" class="label" fill="#fda4af" font-size="11">全局航向角</text>

  <!-- 视线延长虚线 (从 P 继续往前延伸，用于测量 alpha) -->
  <!-- 延长线向量与 OP 同向: dx=150/2.8=53, dy=-240/2.8=-85 => (370+53, 180-85) = (423, 95) -->
  <line x1="370" y1="180" x2="430" y2="84" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3"/>
  <text x="435" y="95" class="label" fill="#38bdf8" font-size="11">视线延长线</text>

  <!-- 观测角 alpha 弧线 (从 视线延长线 到 车头朝向) -->
  <path d="M 412 113 A 75 75 0 0 1 392 95" fill="none" stroke="#4ade80" stroke-width="3" marker-end="url(#arr-arc)"/>
  <text x="415" y="125" class="math" fill="#4ade80" font-size="17" font-weight="bold">α (alpha)</text>
  <text x="415" y="140" class="label" fill="#86efac" font-size="12">观测角 (Observation Angle)</text>

  <!-- ==================== 右侧原理详解卡片 ==================== -->
  <g transform="translate(540, 75)">
    <rect width="295" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="295" height="38" rx="12" fill="#0f172a"/>
    <text x="15" y="24" class="card-title">🔍 为什么需要 alpha 观测角？</text>

    <!-- 核心痛点 -->
    <text x="15" y="65" class="label" fill="#fbbf24">1. 神经网络的“视觉困惑”:</text>
    <text x="25" y="85" class="card-desc">当汽车在图像正中心时，拍到正侧面；</text>
    <text x="25" y="103" class="card-desc">当汽车移动到图像右边缘时，若仍然拍到</text>
    <text x="25" y="121" class="card-desc">同样的正侧面，它的<tspan fill="#f43f5e" font-weight="bold">全局 yaw 必须已经转动</tspan>！</text>
    <text x="25" y="139" class="card-desc">CNN 卷积特征只感知“视觉外观”，因此</text>
    <text x="25" y="157" class="card-desc"><tspan fill="#4ade80" font-weight="bold">网络直接预测的是观测角 alpha</tspan>！</text>

    <!-- 几何换算公式 -->
    <line x1="15" y1="172" x2="280" y2="172" stroke="#334155" stroke-width="1"/>
    <text x="15" y="195" class="label" fill="#38bdf8">2. 严格几何换算关系:</text>
    
    <text x="25" y="220" class="label" fill="#94a3b8" font-size="12">① 视线方位角 β:</text>
    <text x="35" y="240" class="math" fill="#38bdf8" font-weight="bold">β = arctan2(X, Z)</text>

    <text x="25" y="270" class="label" fill="#94a3b8" font-size="12">② 观测角 α (视觉相对角):</text>
    <rect x="25" y="280" width="245" height="32" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="147" y="302" class="math" fill="#a7f3d0" font-weight="bold" text-anchor="middle">α = rotation_y - β</text>

    <text x="25" y="332" class="label" fill="#94a3b8" font-size="12">③ 全局航向角 rotation_y (世界真值):</text>
    <rect x="25" y="342" width="245" height="32" rx="6" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
    <text x="147" y="364" class="math" fill="#fecdd3" font-weight="bold" text-anchor="middle">rotation_y = α + β</text>

    <!-- 结论 -->
    <text x="25" y="398" class="card-desc" fill="#94a3b8">KITTI 评估工具以预测的 rotation_y 为准</text>
  </g>

</svg>
