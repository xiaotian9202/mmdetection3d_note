<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- 归一化平面渐变 -->
    <linearGradient id="normPlaneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- 像平面渐变 -->
    <linearGradient id="imgPlaneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.05"/>
    </linearGradient>

    <!-- 光线发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 箭头标记 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
    .math { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; font-size: 14px; }
    .dim-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #cbd5e1; }
  </style>

  <!-- 背景底板 -->
  <rect width="860" height="480" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- 顶部标题与图例栏 -->
  <text x="30" y="38" class="title">针孔相机成像与双平面立体模型 (Pinhole Camera Model)</text>
  
  <!-- 图例标签 -->
  <g transform="translate(460, 22)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#38bdf8"/>
    <text x="18" y="10.5" class="label" fill="#38bdf8" font-size="12">归一化平面 (Z=1)</text>

    <rect x="145" y="0" width="12" height="12" rx="3" fill="#4ade80"/>
    <text x="163" y="10.5" class="label" fill="#4ade80" font-size="12">物理像平面 (Z=f)</text>

    <rect x="290" y="0" width="12" height="12" rx="3" fill="#f43f5e"/>
    <text x="308" y="10.5" class="label" fill="#f43f5e" font-size="12">成像光线 (Ray)</text>
  </g>

  <!-- 网格辅助背景（微弱） -->
  <line x1="80" y1="280" x2="810" y2="280" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="815" y="284" class="label" fill="#94a3b8">Z 轴 (光轴)</text>

  <!-- Y 轴 (垂直向上示意) -->
  <line x1="140" y1="280" x2="140" y2="70" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="145" y="80" class="label" fill="#94a3b8">X 轴 (横向偏移)</text>

  <!-- ==================== 1. 归一化平面 (Z = 1) ==================== -->
  <!-- 平面斜视阴影面板 (增强 3D 空间立体感) -->
  <polygon points="260,110 300,90 300,340 260,360" fill="url(#normPlaneGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  <!-- 截面基准垂线 -->
  <line x1="280" y1="100" x2="280" y2="350" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="280" y="80" class="label" fill="#38bdf8" text-anchor="middle">归一化平面</text>
  <text x="280" y="96" class="math" fill="#7dd3fc" text-anchor="middle" font-size="12">Z = 1</text>

  <!-- ==================== 2. 物理像平面 (Z = f) ==================== -->
  <!-- 平面斜视阴影面板 -->
  <polygon points="420,80 470,55 470,370 420,395" fill="url(#imgPlaneGrad)" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.8"/>
  <!-- 截面基准垂线 -->
  <line x1="445" y1="68" x2="445" y2="382" stroke="#4ade80" stroke-width="2.5"/>
  <text x="445" y="48" class="label" fill="#4ade80" text-anchor="middle">物理像平面 (CMOS)</text>
  <text x="445" y="64" class="math" fill="#86efac" text-anchor="middle" font-size="12">Z = f (焦距)</text>

  <!-- ==================== 3. 真实物体所在的平面 (Z = Zc) ==================== -->
  <line x1="720" y1="110" x2="720" y2="280" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- ==================== 4. 关键光线 (P -> O) ==================== -->
  <!-- 光线发光底层 -->
  <line x1="720" y1="110" x2="140" y2="280" stroke="#f43f5e" stroke-width="5" stroke-opacity="0.3" filter="url(#glow)"/>
  <!-- 主光线实线 -->
  <line x1="720" y1="110" x2="140" y2="280" stroke="#f43f5e" stroke-width="2.5" marker-mid="url(#arrow-red)"/>

  <!-- ==================== 5. 关键几何交点标注 ==================== -->
  <!-- 光心 O(0,0,0) -->
  <circle cx="140" cy="280" r="6" fill="#f8fafc" stroke="#f43f5e" stroke-width="2.5"/>
  <text x="125" y="302" class="label" fill="#f8fafc">光心 O (0, 0, 0)</text>

  <!-- 归一化平面穿透点 pn (xn, 1) -->
  <circle cx="280" cy="239" r="5" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <!-- 高度指示虚线 -->
  <line x1="280" y1="239" x2="280" y2="280" stroke="#38bdf8" stroke-width="2"/>
  <text x="290" y="235" class="math" fill="#38bdf8" font-size="15" font-weight="bold">p<tspan font-size="10" dy="3">n</tspan><tspan dy="-3"> = (x</tspan><tspan font-size="10" dy="3">n</tspan><tspan dy="-3">, 1)</tspan></text>
  <text x="292" y="265" class="label" fill="#38bdf8" font-size="12">高度 x<tspan font-size="9">n</tspan> = X<tspan font-size="9">c</tspan>/Z<tspan font-size="9">c</tspan></text>

  <!-- 物理像平面穿透点 p (x, f) -->
  <circle cx="445" cy="190.5" r="5" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
  <!-- 高度指示虚线 -->
  <line x1="445" y1="190.5" x2="445" y2="280" stroke="#4ade80" stroke-width="2"/>
  <text x="455" y="185" class="math" fill="#4ade80" font-size="15" font-weight="bold">p = (x, f)</text>
  <text x="455" y="205" class="label" fill="#4ade80" font-size="12">高度 x = f · x<tspan font-size="9">n</tspan></text>

  <!-- 真实物体点 P(Xc, Yc, Zc) -->
  <circle cx="720" cy="110" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="2.5" filter="url(#glow)"/>
  <text x="732" y="110" class="label" fill="#fbbf24" font-size="15">目标物体 P</text>
  <text x="732" y="130" class="math" fill="#fde68a" font-size="14">(X<tspan font-size="10">c</tspan>, Y<tspan font-size="10">c</tspan>, Z<tspan font-size="10">c</tspan>)</text>
  <text x="732" y="195" class="label" fill="#f59e0b" font-size="12">实际横向偏离 X<tspan font-size="9">c</tspan></text>

  <!-- 垂足点标注 -->
  <circle cx="280" cy="280" r="3" fill="#38bdf8"/>
  <text x="272" y="298" class="math" fill="#7dd3fc" font-size="12">C<tspan font-size="9">n</tspan>(0,1)</text>

  <circle cx="445" cy="280" r="3" fill="#4ade80"/>
  <text x="437" y="298" class="math" fill="#86efac" font-size="12">C<tspan font-size="9">f</tspan>(0,f)</text>

  <circle cx="720" cy="280" r="3" fill="#f59e0b"/>
  <text x="712" y="298" class="math" fill="#fde68a" font-size="12">C(0,Z<tspan font-size="9">c</tspan>)</text>

  <!-- ==================== 6. 底部尺寸测量标尺 (深度对齐) ==================== -->
  <g transform="translate(0, 360)">
    <!-- 标尺 1: 光心到归一化平面 (Z = 1) -->
    <line x1="140" y1="10" x2="280" y2="10" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="140" y1="5" x2="140" y2="15" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="280" y1="5" x2="280" y2="15" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="28" class="dim-text" fill="#38bdf8" text-anchor="middle">深度 = 1 (基准单位)</text>

    <!-- 标尺 2: 光心到物理像平面 (Z = f) -->
    <line x1="140" y1="45" x2="445" y2="45" stroke="#4ade80" stroke-width="1.5"/>
    <line x1="140" y1="40" x2="140" y2="50" stroke="#4ade80" stroke-width="1.5"/>
    <line x1="445" y1="40" x2="445" y2="50" stroke="#4ade80" stroke-width="1.5"/>
    <text x="292" y="63" class="dim-text" fill="#4ade80" text-anchor="middle">深度 = f (相机物理焦距)</text>

    <!-- 标尺 3: 光心到真实物体 (Z = Zc) -->
    <line x1="140" y1="80" x2="720" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="140" y1="75" x2="140" y2="85" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="720" y1="75" x2="720" y2="85" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="430" y="98" class="dim-text" text-anchor="middle">深度 = Z<tspan font-size="9">c</tspan> (物体真实前向距离)</text>
  </g>

</svg>
