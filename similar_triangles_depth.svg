<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgTri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- 两个相似三角形半透明填充色 -->
    <linearGradient id="smallTriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="largeTriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glowTri" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arr-axis-tri" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-ray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #f8fafc; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
    .math { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; font-size: 15px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
    .dim-line { stroke: #64748b; stroke-width: 1.5; }
    .dim-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; }
  </style>

  <rect width="840" height="480" rx="16" fill="url(#bgTri)" stroke="#1e293b" stroke-width="2"/>

  <!-- 标题栏 -->
  <text x="35" y="38" class="title">相似直角三角形推导归一化坐标 xn = Xc / Zc</text>
  <text x="35" y="60" class="label" fill="#94a3b8" font-size="12">初中几何 AA 相似判定（公共夹角 α + 两个直角 90°）对应边严格成比例</text>

  <!-- ==================== 几何作图区 ==================== -->
  <!-- 原点 O 设在 (100, 330) -->
  <!-- 光轴 Z 轴 (水平) -->
  <line x1="60" y1="330" x2="550" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#arr-axis-tri)"/>
  <text x="555" y="335" class="label" fill="#cbd5e1">Z 轴 (光轴/深度)</text>

  <!-- 纵轴 X 轴 (向上) -->
  <line x1="100" y1="360" x2="100" y2="70" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-axis-tri)"/>
  <text x="105" y="75" class="label" fill="#cbd5e1">X 轴 (横向偏移)</text>

  <!-- 点位定义:
       O = (100, 330)
       Cn = (240, 330), Pn = (240, 235)  => 小三角形底边=140, 高=95
       C  = (480, 330), P  = (480, 100)  => 大三角形底边=380, 高=230 (比例 2.714)
  -->

  <!-- 大三角形 △OCP 面板填充 -->
  <polygon points="100,330 480,330 480,100" fill="url(#largeTriGrad)" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- 小三角形 △OCnPn 面板填充 -->
  <polygon points="100,330 240,330 240,235" fill="url(#smallTriGrad)" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- 成像光线 OP (红色实线激光) -->
  <line x1="480" y1="100" x2="100" y2="330" stroke="#f43f5e" stroke-width="3" filter="url(#glowTri)"/>
  <!-- 光线箭头 -->
  <line x1="330" y1="190" x2="320" y2="196" stroke="#f43f5e" stroke-width="3" marker-end="url(#arr-ray)"/>

  <!-- 垂足 Cn 直角符号 -->
  <polyline points="240,318 228,318 228,330" fill="none" stroke="#38bdf8" stroke-width="1.8"/>

  <!-- 垂足 C 直角符号 -->
  <polyline points="480,318 468,318 468,330" fill="none" stroke="#f59e0b" stroke-width="1.8"/>

  <!-- 夹角 α 弧度 (公共角) -->
  <path d="M 150 330 A 50 50 0 0 0 144 299" fill="none" stroke="#f43f5e" stroke-width="2"/>
  <text x="156" y="318" class="math" fill="#f43f5e" font-size="16" font-weight="bold">α</text>

  <!-- ==================== 顶点圆圈与标注 ==================== -->
  <!-- 点 O(0,0) -->
  <circle cx="100" cy="330" r="5" fill="#f8fafc" stroke="#f43f5e" stroke-width="2"/>
  <text x="80" y="352" class="math" fill="#f8fafc" font-size="14">O(0,0)</text>

  <!-- 点 Cn(0,1) -->
  <circle cx="240" cy="330" r="4" fill="#38bdf8"/>
  <text x="230" y="352" class="math" fill="#38bdf8" font-size="14">C<tspan font-size="10">n</tspan>(0, 1)</text>

  <!-- 点 Pn(xn, 1) -->
  <circle cx="240" cy="235" r="6" fill="#38bdf8" filter="url(#glowTri)"/>
  <text x="250" y="235" class="math" fill="#38bdf8" font-size="16" font-weight="bold">P<tspan font-size="11">n</tspan>(x<tspan font-size="11">n</tspan>, 1)</text>

  <!-- 小三角形垂直高 xn 标注 -->
  <line x1="240" y1="235" x2="240" y2="330" stroke="#38bdf8" stroke-width="3"/>
  <text x="248" y="285" class="label" fill="#38bdf8" font-size="15">高 = x<tspan font-size="10">n</tspan></text>

  <!-- 点 C(0, Zc) -->
  <circle cx="480" cy="330" r="4" fill="#f59e0b"/>
  <text x="470" y="352" class="math" fill="#f59e0b" font-size="14">C(0, Z<tspan font-size="10">c</tspan>)</text>

  <!-- 点 P(Xc, Zc) -->
  <circle cx="480" cy="100" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="2" filter="url(#glowTri)"/>
  <text x="492" y="98" class="math" fill="#fbbf24" font-size="16" font-weight="bold">P(X<tspan font-size="11">c</tspan>, Z<tspan font-size="11">c</tspan>)</text>

  <!-- 大三角形垂直高 Xc 标注 -->
  <line x1="480" y1="100" x2="480" y2="330" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="488" y="210" class="label" fill="#f59e0b" font-size="15">高 = X<tspan font-size="10">c</tspan></text>

  <!-- ==================== 底部尺寸测量标尺 ==================== -->
  <!-- 标尺 1: 底边 = 1 -->
  <line x1="100" y1="390" x2="240" y2="390" class="dim-line" stroke="#38bdf8"/>
  <line x1="100" y1="384" x2="100" y2="396" class="dim-line" stroke="#38bdf8"/>
  <line x1="240" y1="384" x2="240" y2="396" class="dim-line" stroke="#38bdf8"/>
  <text x="170" y="410" class="dim-text" fill="#38bdf8" text-anchor="middle">小底边 = 1 (归一化深度)</text>

  <!-- 标尺 2: 底边 = Zc -->
  <line x1="100" y1="440" x2="480" y2="440" class="dim-line" stroke="#f59e0b"/>
  <line x1="100" y1="434" x2="100" y2="446" class="dim-line" stroke="#f59e0b"/>
  <line x1="480" y1="434" x2="480" y2="446" class="dim-line" stroke="#f59e0b"/>
  <text x="290" y="460" class="dim-text" fill="#f59e0b" text-anchor="middle">大底边 = Z<tspan font-size="9">c</tspan> (真实空间物体前向深度)</text>

  <!-- ==================== 右侧数学证明卡片 ==================== -->
  <g transform="translate(560, 75)">
    <rect width="250" height="375" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="250" height="38" rx="12" fill="#0f172a"/>
    <text x="15" y="24" class="card-title">📐 初中几何 3 步严密证明</text>

    <!-- 步骤 1: 判定相似 -->
    <text x="15" y="65" class="label" fill="#38bdf8">1. 判定两个直角三角形相似:</text>
    <text x="25" y="86" class="label" fill="#cbd5e1" font-size="12">① 直角: ∠OCnPn = ∠OCP = 90°</text>
    <text x="25" y="105" class="label" fill="#cbd5e1" font-size="12">② 公共角: ∠PnOCn = ∠POC = α</text>
    <text x="25" y="128" class="math" fill="#38bdf8" font-size="14" font-weight="bold">∴ △OC<tspan font-size="10">n</tspan>P<tspan font-size="10">n</tspan> ∼ △OCP (AA判定)</text>

    <!-- 步骤 2: 对应边成比例 -->
    <line x1="15" y1="145" x2="235" y2="145" stroke="#334155" stroke-width="1"/>
    <text x="15" y="168" class="label" fill="#f59e0b">2. 对应边比例列式:</text>
    <text x="25" y="195" class="label" fill="#fde68a" font-size="13">小三角形高 / 大三角形高</text>
    <text x="25" y="215" class="label" fill="#fde68a" font-size="13">= 小三角形底 / 大三角形底</text>
    <text x="25" y="245" class="math" fill="#fbbf24" font-size="16" font-weight="bold">x<tspan font-size="11">n</tspan> / X<tspan font-size="11">c</tspan> = 1 / Z<tspan font-size="11">c</tspan></text>

    <!-- 步骤 3: 求解公式 -->
    <line x1="15" y1="265" x2="235" y2="265" stroke="#334155" stroke-width="1"/>
    <text x="15" y="288" class="label" fill="#4ade80">3. 解得核心公式:</text>
    <rect x="20" y="300" width="210" height="35" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="125" y="324" class="math" fill="#a7f3d0" font-size="17" font-weight="bold" text-anchor="middle">x<tspan font-size="12">n</tspan> = X<tspan font-size="12">c</tspan> / Z<tspan font-size="12">c</tspan></text>

    <text x="25" y="355" class="label" fill="#94a3b8" font-size="11">本质: tan α = xn / 1 = Xc / Zc</text>
  </g>

</svg>
